<svg width="1600" height="460" viewBox="0 0 1600 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="gunara.web.id — personal command center">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060d1f"/>
      <stop offset=".55" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#0e1f3f"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset=".55" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="glowA" cx=".8" cy=".22" r=".5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity=".17"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx=".12" cy=".9" r=".5">
      <stop offset="0" stop-color="#1d4ed8" stop-opacity=".2"/>
      <stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#f59e0b" stroke-opacity=".055"/>
    </pattern>
  </defs>

  <rect width="1600" height="460" fill="url(#bg)"/>
  <rect width="1600" height="460" fill="url(#grid)"/>
  <rect width="1600" height="460" fill="url(#glowB)"/>
  <rect width="1600" height="460" fill="url(#glowA)"/>

  <!-- orbit dekoratif -->
  <g transform="translate(1420,96)">
    <circle r="70" fill="none" stroke="#f59e0b" stroke-opacity=".3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
    </circle>
    <circle r="52" fill="none" stroke="#f59e0b" stroke-opacity=".2" stroke-dasharray="6 10">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle r="6" fill="#f59e0b">
      <animate attributeName="opacity" values="1;.35;1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="70" cy="0" r="4" fill="#fbbf24">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g transform="translate(178,364)">
    <circle r="54" fill="none" stroke="#5c87b8" stroke-opacity=".3">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="26s" repeatCount="indefinite"/>
    </circle>
    <circle cx="54" cy="0" r="3.5" fill="#f59e0b">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- frame ganda -->
  <rect x="14" y="14" width="1572" height="432" rx="12" fill="none" stroke="#f59e0b" stroke-opacity=".3"/>
  <rect x="24" y="24" width="1552" height="412" rx="9" fill="none" stroke="#1b3455" stroke-opacity=".9"/>

  <!-- titik sudut -->
  <g fill="#f59e0b">
    <rect x="10" y="10" width="9" height="9" rx="2"/>
    <rect x="1581" y="10" width="9" height="9" rx="2"/>
    <rect x="10" y="441" width="9" height="9" rx="2"/>
    <rect x="1581" y="441" width="9" height="9" rx="2"/>
    <animate attributeName="opacity" values="1;.3;1" dur="2.4s" repeatCount="indefinite"/>
  </g>

  <!-- scan line -->
  <rect x="26" y="25" width="300" height="1.5" fill="#f59e0b" opacity=".55">
    <animate attributeName="x" values="26;1274;26" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- kicker -->
  <text x="800" y="106" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="19" letter-spacing="12" fill="#a9bcd6">PERSONAL COMMAND CENTER</text>

  <!-- judul -->
  <text x="800" y="212" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-weight="800" font-size="92" letter-spacing="4" fill="url(#amber)">GUNARA.WEB.ID</text>

  <!-- garis pemisah -->
  <g stroke="#1b3455" stroke-width="1">
    <line x1="430" y1="248" x2="660" y2="248"/>
    <line x1="940" y1="248" x2="1170" y2="248"/>
  </g>
  <path d="M800 240 L812 248 L800 256 L788 248 Z" fill="#f59e0b">
    <animate attributeName="opacity" values="1;.4;1" dur="3s" repeatCount="indefinite"/>
  </path>

  <!-- tagline -->
  <text x="800" y="292" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="25" letter-spacing="1" fill="#e6eef8">Gugun Gunara — Arsitek Sistem Peradaban Digital</text>
  <text x="800" y="322" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#a9bcd6">Struktur sebelum karya — sistem sebelum skala</text>

  <!-- DNA formula chips -->
  <g transform="translate(372,348)">
    <g>
      <rect width="52" height="44" rx="9" fill="#0a1628" stroke="#f59e0b" stroke-opacity=".6"/>
      <text x="26" y="29" text-anchor="middle" font-family="'JetBrains Mono', Menlo, monospace" font-size="21" font-weight="700" fill="#fbbf24">V</text>
      <animate attributeName="opacity" values=".5;1;.5" dur="4.5s" begin="0s" repeatCount="indefinite"/>
    </g>
    <text x="68" y="30" font-family="monospace" font-size="17" fill="#5c87b8">→</text>
    <g transform="translate(92,0)">
      <rect width="52" height="44" rx="9" fill="#0a1628" stroke="#f59e0b" stroke-opacity=".6"/>
      <text x="26" y="29" text-anchor="middle" font-family="'JetBrains Mono', Menlo, monospace" font-size="21" font-weight="700" fill="#fbbf24">K</text>
      <animate attributeName="opacity" values=".5;1;.5" dur="4.5s" begin=".5s" repeatCount="indefinite"/>
    </g>
    <text x="160" y="30" font-family="monospace" font-size="17" fill="#5c87b8">→</text>
    <g transform="translate(184,0)">
      <rect width="52" height="44" rx="9" fill="#0a1628" stroke="#f59e0b" stroke-opacity=".6"/>
      <text x="26" y="29" text-anchor="middle" font-family="'JetBrains Mono', Menlo, monospace" font-size="21" font-weight="700" fill="#fbbf24">A</text>
      <animate attributeName="opacity" values=".5;1;.5" dur="4.5s" begin="1s" repeatCount="indefinite"/>
    </g>
    <text x="252" y="30" font-family="monospace" font-size="17" fill="#5c87b8">→</text>
    <g transform="translate(276,0)">
      <rect width="52" height="44" rx="9" fill="#0a1628" stroke="#f59e0b" stroke-opacity=".6"/>
      <text x="26" y="29" text-anchor="middle" font-family="'JetBrains Mono', Menlo, monospace" font-size="21" font-weight="700" fill="#fbbf24">D</text>
      <animate attributeName="opacity" values=".5;1;.5" dur="4.5s" begin="1.5s" repeatCount="indefinite"/>
    </g>
    <text x="344" y="30" font-family="monospace" font-size="17" fill="#5c87b8">→</text>
    <g transform="translate(368,0)">
      <rect width="52" height="44" rx="9" fill="#0a1628" stroke="#f59e0b" stroke-opacity=".6"/>
      <text x="26" y="29" text-anchor="middle" font-family="'JetBrains Mono', Menlo, monospace" font-size="21" font-weight="700" fill="#fbbf24">P</text>
      <animate attributeName="opacity" values=".5;1;.5" dur="4.5s" begin="2s" repeatCount="indefinite"/>
    </g>
    <text x="436" y="30" font-family="monospace" font-size="17" fill="#5c87b8">→</text>
    <g transform="translate(460,0)">
      <rect width="52" height="44" rx="9" fill="#0a1628" stroke="#f59e0b" stroke-opacity=".6"/>
      <text x="26" y="29" text-anchor="middle" font-family="'JetBrains Mono', Menlo, monospace" font-size="21" font-weight="700" fill="#fbbf24">S</text>
      <animate attributeName="opacity" values=".5;1;.5" dur="4.5s" begin="2.5s" repeatCount="indefinite"/>
    </g>
    <text x="528" y="30" font-family="monospace" font-size="17" fill="#5c87b8">→</text>
    <g transform="translate(552,0)">
      <rect width="52" height="44" rx="9" fill="#0a1628" stroke="#f59e0b" stroke-opacity=".6"/>
      <text x="26" y="29" text-anchor="middle" font-family="'JetBrains Mono', Menlo, monospace" font-size="21" font-weight="700" fill="#fbbf24">M</text>
      <animate attributeName="opacity" values=".5;1;.5" dur="4.5s" begin="3s" repeatCount="indefinite"/>
    </g>
    <text x="620" y="30" font-family="monospace" font-size="17" fill="#5c87b8">→</text>
    <g transform="translate(644,0)">
      <rect width="52" height="44" rx="9" fill="#0a1628" stroke="#f59e0b" stroke-opacity=".6"/>
      <text x="26" y="29" text-anchor="middle" font-family="'JetBrains Mono', Menlo, monospace" font-size="21" font-weight="700" fill="#fbbf24">L</text>
      <animate attributeName="opacity" values=".5;1;.5" dur="4.5s" begin="3.5s" repeatCount="indefinite"/>
    </g>
    <text x="712" y="30" font-family="monospace" font-size="17" fill="#5c87b8">→</text>
    <g transform="translate(736,0)">
      <rect width="52" height="44" rx="9" fill="#f59e0b" stroke="#fbbf24" stroke-opacity=".9"/>
      <text x="26" y="29" text-anchor="middle" font-family="'JetBrains Mono', Menlo, monospace" font-size="21" font-weight="700" fill="#060d1f">E</text>
      <animate attributeName="opacity" values=".65;1;.65" dur="4.5s" begin="4s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- statistik bawah -->
  <text x="800" y="428" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="16" letter-spacing="3" fill="#a9bcd6">165 DOKUMEN · 20 DOMAIN KEPEMIMPINAN · 3 ORGANISASI · AAA 9.01:1</text>
</svg>
